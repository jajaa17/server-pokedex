<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Pokedex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #eaf4ff;
    --bg-b: #fff7e0;
    --panel: #ffffff;
    --panel-2: #f4f6fb;
    --line: #e7e4d8;
    --text: #2c2a3a;
    --muted: #8087a0;
    --accent: #ee1515;
    --accent-dark: #c30f0f;
    --gold: #ffcb05;
    --blue: #3b6fe0;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --head: 'Baloo 2', ui-rounded, 'Nunito', sans-serif;
    --body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(circle at 8% 14%, rgba(255,255,255,0.55) 0 3px, transparent 4px),
      radial-gradient(circle at 32% 68%, rgba(255,255,255,0.5) 0 3px, transparent 4px),
      radial-gradient(circle at 58% 22%, rgba(255,255,255,0.5) 0 3px, transparent 4px),
      radial-gradient(circle at 78% 78%, rgba(255,255,255,0.5) 0 3px, transparent 4px),
      radial-gradient(circle at 90% 40%, rgba(255,255,255,0.5) 0 3px, transparent 4px),
      linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--body);
    line-height: 1.45;
  }
  h1, h2, h3, h4 { font-family: var(--head); }

  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(4deg); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-6deg) scale(1.08); } 75% { transform: rotate(6deg) scale(1.08); } }
  @keyframes spinBall { to { transform: rotate(360deg); } }

  header {
    position: relative;
    padding: 26px 20px 34px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    border-radius: 0 0 28px 28px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 10px 24px rgba(200,20,20,0.25);
    overflow: hidden;
  }
  header::before {
    /* the little pokedex "lens" lights */
    content: "";
    position: absolute;
    top: 18px; left: 20px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cdeaff, #3b6fe0 60%, #1c3f8f 100%);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.85), 0 2px 6px rgba(0,0,0,0.25);
  }
  header::after {
    content: "";
    position: absolute;
    top: 24px; left: 52px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ffcb05;
    box-shadow: 10px 0 0 #35c25a, 20px 0 0 #ee1515;
  }
  .mascot {
    position: absolute;
    top: 14px;
    right: 22px;
    font-size: 34px;
    animation: floaty 3.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));
  }
  header h1 {
    margin: 22px 0 4px;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0;
    color: #ffe5e5;
    font-size: 14px;
    max-width: 560px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .controls::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(230,220,190,0.7);
    z-index: -1;
  }
  input[type="search"], select {
    background: var(--panel);
    border: 2px solid var(--line);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-family: var(--body);
    font-weight: 600;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04);
  }
  input[type="search"] { flex: 1 1 220px; min-width: 160px; }
  select { flex: 0 0 auto; cursor: pointer; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(238,21,21,0.15); }

  .count {
    padding: 10px 20px 4px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 60px 20px;
    color: var(--muted);
    font-weight: 700;
  }
  .pokeball-spin {
    width: 40px; height: 40px;
    border-radius: 50%;
    background:
      linear-gradient(var(--panel), var(--panel)) center/14px 14px no-repeat,
      linear-gradient(to bottom, var(--accent) 0%, var(--accent) 48%, #222 48%, #222 52%, var(--panel) 52%, var(--panel) 100%);
    border: 3px solid #222;
    animation: spinBall 0.9s linear infinite;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    padding: 8px 20px 48px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    padding-top: 16px;
    cursor: pointer;
    position: relative;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04), 0 6px 14px rgba(60,50,20,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: popIn 0.25s ease both;
    overflow: hidden;
  }
  .card::before {
    /* colored top edge matching primary type, set inline via style attr */
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--type-color, var(--gold));
  }
  .card:hover {
    transform: translateY(-4px) scale(1.015);
    box-shadow: 0 10px 0 rgba(0,0,0,0.03), 0 16px 26px rgba(60,50,20,0.14);
    border-color: #f0d98c;
  }
  .card:hover .sprite { animation: wiggle 0.5s ease; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .dex {
    font-family: var(--mono);
    color: #fff;
    background: var(--blue);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .sprite {
    width: 56px;
    height: 56px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    flex: 0 0 auto;
    background: var(--panel-2);
    border-radius: 12px;
  }
  .sprite-lg {
    width: 120px;
    height: 120px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    display: block;
    margin: 0 auto 4px;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .name { font-size: 16px; font-weight: 700; margin: 8px 0 8px; font-family: var(--head); }
  .types { display: flex; gap: 6px; flex-wrap: wrap; }
  .type-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
    text-transform: capitalize;
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.12);
  }
  .missing-note {
    margin-top: 8px;
    font-size: 12px;
    color: #b5790f;
  }
  .form-badge {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: #efe3ff;
    color: #7a4fc9;
    vertical-align: middle;
  }
  .snack-section {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fff6e8;
    border: 1px solid #f2dfb3;
  }
  .snack-section h4 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #a97a1f;
  }
  .snack-row {
    font-size: 13px;
    margin-bottom: 4px;
  }
  .snack-row .snack-name { color: var(--text); font-weight: 700; }

  .mechanics-section {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fff0f0;
    border: 1px solid #f5c9c9;
  }
  .mechanics-section h4 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent-dark);
  }
  .mechanics-note {
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .mechanics-note:last-child { margin-bottom: 0; }

  .evo-section { margin-top: 14px; }
  .evo-section h4 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .evo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-radius: 10px;
  }
  .evo-row:hover { background: var(--panel-2); }
  .evo-sprite {
    width: 40px;
    height: 40px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    flex: 0 0 auto;
    background: var(--panel-2);
    border-radius: 10px;
  }
  .evo-arrow { color: var(--accent); font-weight: 700; flex: 0 0 auto; }
  .evo-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .evo-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }
  .evo-name:hover { color: var(--accent); }
  .evo-desc { font-size: 12px; color: var(--muted); }

  /* Type colors, matching the standard Pokemon type palette */
  .t-normal   { background: #A8A77A; } .t-fire   { background: #EE8130; }
  .t-water    { background: #6390F0; } .t-electric{ background: #F7D02C; }
  .t-grass    { background: #7AC74C; } .t-ice    { background: #96D9D6; }
  .t-fighting { background: #C22E28; } .t-poison { background: #A33EA1; }
  .t-ground   { background: #E2BF65; } .t-flying { background: #A98FF3; }
  .t-psychic  { background: #F95587; } .t-bug    { background: #A6B91A; }
  .t-rock     { background: #B6A136; } .t-ghost  { background: #735797; }
  .t-dragon   { background: #6F35FC; } .t-dark   { background: #705746; }
  .t-steel    { background: #B7B7CE; } .t-fairy  { background: #D685AD; }

  /* Detail overlay -- styled like an open Pokedex screen */
  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(30,20,10,0.55);
    z-index: 20;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  #overlay.open { display: flex; }
  .sheet {
    background: var(--panel);
    border-radius: 22px;
    max-width: 480px;
    width: 100%;
    padding: 0 0 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    animation: popIn 0.2s ease both;
    overflow: hidden;
  }
  .sheet-screen {
    background: linear-gradient(160deg, var(--screen-color, #7fb8ff) 0%, rgba(255,255,255,0.4) 100%);
    padding: 20px 24px 10px;
    text-align: center;
    position: relative;
  }
  .sheet-close {
    position: absolute;
    top: 14px; right: 16px;
    background: rgba(255,255,255,0.7);
    border: none;
    color: var(--text);
    font-size: 18px;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
    font-weight: 700;
  }
  .sheet-close:hover { background: #fff; }
  .sheet-body { padding: 14px 24px 0; }
  .sheet h2 { margin: 4px 0 2px; font-size: 24px; font-weight: 800; }
  .sheet .dex { display: inline-block; margin-bottom: 6px; }
  .sheet .types { justify-content: center; margin-top: 6px; }

  .flavor-bubble {
    margin: 14px 0 4px;
    background: var(--panel-2);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    position: relative;
    font-size: 13.5px;
    line-height: 1.55;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .flavor-bubble .flavor-text { flex: 1 1 auto; }
  .speak-btn {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--blue);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }
  .speak-btn:hover { filter: brightness(1.08); }
  .speak-btn.speaking { animation: wiggle 0.6s ease infinite; background: var(--accent); }
  .speak-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }

  .spawn-row {
    border-top: 1px dashed var(--line);
    padding: 10px 0;
    font-size: 13px;
  }
  .spawn-row .bucket {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .spawn-row .biomes { color: var(--text); display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .biome-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eaf6ea;
    border: 1px solid #cde8cd;
    color: #2f7a3d;
    font-weight: 600;
  }
  .spawn-row .level { color: var(--muted); margin-top: 6px; font-weight: 700; }
  .condition-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .condition-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eaf1ff;
    border: 1px solid #c8d9fb;
    color: #2f5ac9;
    font-weight: 600;
  }
  .bonus-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eafff0;
    border: 1px solid #bdeecb;
    color: #1f8a49;
    font-weight: 600;
  }
  .no-spawn-text { color: var(--muted); font-size: 13px; padding-top: 10px; }

  footer {
    padding: 24px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 22px; }
    .mascot { font-size: 26px; top: 12px; right: 14px; }
  }
</style>
</head>
<body>

<header>
  <span class="mascot" aria-hidden="true">📡</span>
  <h1>Server Pokedex</h1>
  <p>Search every Pokemon available on this server (Cobblemon + All The Mons x Mega Showdown) and where to find them.</p>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Search by name or dex number..." autocomplete="off">
  <select id="type-filter">
    <option value="">All types</option>
  </select>
  <select id="biome-filter">
    <option value="">All biomes</option>
  </select>
  <select id="sort">
    <option value="dex">Sort: Dex number</option>
    <option value="name">Sort: Name (A-Z)</option>
    <option value="type">Sort: Primary type</option>
  </select>
</div>

<div class="count" id="count"></div>
<div id="loading"><div class="pokeball-spin"></div><p>Loading the dex&hellip;</p></div>
<div id="grid" style="display:none;"></div>

<div id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<footer>Data pulled from the server's Cobblemon and All The Mons x Mega Showdown files. Spawn odds and biomes can change when the mods update.</footer>

<script>
let DEX = [];
let DEX_BY_ID = {};
// Reverse of each entry's own "evolvesTo": id -> [{from, description}]. Built
// once after load() so every evolution line only has one source of truth
// (the "evolvesTo" list on the pre-evolution entry) instead of duplicating
// data in both directions inside pokedex.json.
let EVOLVES_FROM = {};

// Sprite from the national dex number (all species on this server, including
// the ATM x MSD additions, use real national dex numbers, so this works for
// the whole list). A regional-form entry (Alolan/Galarian/Hisuian/Paldean)
// carries its own PokeAPI variety id in spriteId when one exists, so it
// shows its own look instead of the base form's. A handful of Cobblemon's
// invented "regional-bias" pre-evolution recolors (e.g. Hisuian Rowlet)
// have no real PokeAPI variety, so those fall back to the base dex sprite.
// Falls back to a pokeball placeholder if a sprite 404s.
function spriteUrl(p) {
  const id = p.spriteId || p.dex;
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
}
const SPRITE_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#9096a6" stroke-width="1.5"/><line x1="2" y1="12" x2="22" y2="12" stroke="#9096a6" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="#16181d" stroke="#9096a6" stroke-width="1.5"/></svg>`
);

// Mirrors the .t-<type> colors in the CSS above, so cards/sheet can set a
// matching --type-color / --screen-color inline style per Pokemon.
const TYPE_COLORS = {
  normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C',
  grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1',
  ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A',
  rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746',
  steel: '#B7B7CE', fairy: '#D685AD',
};
function typeColor(p) {
  return TYPE_COLORS[(p.types && p.types[0]) || 'normal'] || '#ffcb05';
}

// Maps each raw spawn-condition biome ref (e.g. "#cobblemon:is_end" or a
// literal like "minecraft:frozen_river") to the real, concrete biome names
// it resolves to on this server's actual mod set (vanilla + Terralith;
// Tectonic reshapes terrain but adds no new biome IDs of its own). Built
// offline by tools/build_biome_names.py from the Cobblemon/Terralith jars
// plus vanilla's own tag data -- see that script for how. Any ref that
// only ever pointed at an uninstalled biome mod (Aether, Biomes O'Plenty,
// The Bumblezone, etc.) resolves to an empty list here.
let BIOME_NAMES = {};

function namesForRef(ref) {
  return BIOME_NAMES[ref] || [];
}

// All real biome names a Pokemon can actually be found in on this server,
// across every one of its spawn entries.
function biomeNames(p) {
  const set = new Set();
  for (const s of (p.spawns || [])) {
    for (const b of (s.biomes || [])) for (const name of namesForRef(b)) set.add(name);
  }
  return set;
}

// Turns a raw block/structure id or tag (e.g. "#minecraft:village",
// "cobblemon:apricorn_tree", "minecraft:snow_block") into something
// readable ("Village", "Apricorn Tree", "Snow Block").
function prettyId(id) {
  let s = String(id);
  if (s.startsWith('#')) s = s.slice(1);
  s = s.split(':').pop();
  s = s.replace(/[_/]/g, ' ');
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

const MOON_PHASE_NAMES = {
  '0': 'Full Moon', '1': 'Waning Gibbous', '2': 'Last Quarter',
  '3': 'Waning Crescent', '4': 'New Moon', '5': 'Waxing Crescent',
  '6': 'First Quarter', '7': 'Waxing Gibbous',
};
function moonPhaseLabel(v) {
  return String(v).split(',').map(s => s.trim())
    .map(p => MOON_PHASE_NAMES[p] || `Phase ${p}`).join(' or ');
}

// Turns a spawn-condition object (or its "not" counterpart) into an array
// of short human-readable labels, e.g. "Night only", "Raining", "Y >= 100".
function conditionLabels(cond, negate) {
  if (!cond) return [];
  const pfx = negate ? 'Not: ' : '';
  const out = [];
  if (cond.timeRange) out.push(`${pfx}${cond.timeRange.charAt(0).toUpperCase()}${cond.timeRange.slice(1)} only`);
  if (cond.moonPhase !== undefined) out.push(`${pfx}Moon: ${moonPhaseLabel(cond.moonPhase)}`);
  if (cond.isRaining !== undefined) out.push(`${pfx}${cond.isRaining ? 'Raining' : 'Not raining'}`);
  if (cond.isThundering !== undefined) out.push(`${pfx}${cond.isThundering ? 'Thunderstorm' : 'No thunderstorm'}`);
  if (cond.canSeeSky !== undefined) out.push(`${pfx}${cond.canSeeSky ? 'Open sky (not indoors/caves)' : 'No sky view (indoors/caves)'}`);
  if (cond.minY !== undefined && cond.maxY !== undefined) out.push(`${pfx}Y ${cond.minY} to ${cond.maxY}`);
  else if (cond.minY !== undefined) out.push(`${pfx}Y ${cond.minY}+`);
  else if (cond.maxY !== undefined) out.push(`${pfx}Y below ${cond.maxY}`);
  if (cond.minSkyLight !== undefined && cond.maxSkyLight !== undefined) out.push(`${pfx}Sky light ${cond.minSkyLight}-${cond.maxSkyLight}`);
  else if (cond.minSkyLight !== undefined) out.push(`${pfx}Sky light ${cond.minSkyLight}+`);
  else if (cond.maxSkyLight !== undefined) out.push(`${pfx}Sky light below ${cond.maxSkyLight}`);
  if (cond.isSlimeChunk !== undefined) out.push(`${pfx}${cond.isSlimeChunk ? 'Slime chunk' : 'Not a slime chunk'}`);
  if (cond.neededNearbyBlocks && cond.neededNearbyBlocks.length) out.push(`${pfx}Near: ${cond.neededNearbyBlocks.map(prettyId).join(', ')}`);
  if (cond.neededBaseBlocks && cond.neededBaseBlocks.length) out.push(`${pfx}Standing on: ${cond.neededBaseBlocks.map(prettyId).join(', ')}`);
  if (cond.structures && cond.structures.length) out.push(`${pfx}Near structure: ${cond.structures.map(prettyId).join(', ')}`);
  return out;
}

// Renders the full condition line (hard requirements + "not" exclusions +
// weight-multiplier "spawns more often when X" bonuses) for one spawn row.
function conditionHtml(s) {
  const cond = s.conditions;
  if (!cond) return '';
  const labels = [...conditionLabels(cond, false), ...conditionLabels(cond.not, true)];
  const bonusLabels = (cond.bonus || []).map(b => {
    const { multiplier, ...rest } = b;
    const parts = conditionLabels(rest, false).map(p => p.replace(/ only$/, ''));
    return `${multiplier}x chance${parts.length ? ' when ' + parts.join(', ').toLowerCase() : ''}`;
  });
  if (!labels.length && !bonusLabels.length) return '';
  return `
    <div class="condition-line">
      ${labels.map(l => `<span class="condition-badge">${l}</span>`).join('')}
      ${bonusLabels.map(l => `<span class="bonus-badge">${l}</span>`).join('')}
    </div>
  `;
}

let SNACKS = null;

async function load() {
  const [dexRes, biomeRes, snackRes] = await Promise.all([
    fetch('pokedex.json'),
    fetch('biome_names.json'),
    fetch('poke_snacks.json'),
  ]);
  DEX = await dexRes.json();
  BIOME_NAMES = await biomeRes.json();
  SNACKS = await snackRes.json();

  DEX_BY_ID = Object.fromEntries(DEX.map(p => [p.id, p]));
  EVOLVES_FROM = {};
  for (const p of DEX) {
    for (const evo of (p.evolvesTo || [])) {
      (EVOLVES_FROM[evo.to] ||= []).push({ from: p.id, description: evo.description });
    }
  }

  const types = [...new Set(DEX.flatMap(p => p.types))].sort();
  const typeSelect = document.getElementById('type-filter');
  for (const t of types) {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    typeSelect.appendChild(opt);
  }

  const biomeSet = new Set();
  for (const p of DEX) for (const name of biomeNames(p)) biomeSet.add(name);
  const biomes = [...biomeSet].sort((a, b) => a.localeCompare(b));
  const biomeSelect = document.getElementById('biome-filter');
  for (const b of biomes) {
    const opt = document.createElement('option');
    opt.value = b;
    opt.textContent = b;
    biomeSelect.appendChild(opt);
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('grid').style.display = '';
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const typeFilter = document.getElementById('type-filter').value;
  const biomeFilter = document.getElementById('biome-filter').value;
  const sortBy = document.getElementById('sort').value;

  let list = DEX.filter(p => {
    if (typeFilter && !p.types.includes(typeFilter)) return false;
    if (biomeFilter && !biomeNames(p).has(biomeFilter)) return false;
    if (!q) return true;
    return p.name.toLowerCase().includes(q) || String(p.dex).includes(q);
  });

  if (sortBy === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  else if (sortBy === 'type') list = [...list].sort((a, b) =>
    (a.types[0] || '').localeCompare(b.types[0] || '') || a.dex - b.dex);
  else list = [...list].sort((a, b) => a.dex - b.dex);

  document.getElementById('count').textContent =
    `${list.length} of ${DEX.length} Pokemon`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const p of list) {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.style.setProperty('--type-color', typeColor(p));
    card.innerHTML = `
      <div class="card-top">
        <div class="card-head">
          <img class="sprite" src="${spriteUrl(p)}" onerror="this.onerror=null;this.src='${SPRITE_FALLBACK}'" alt="${p.name} sprite" loading="lazy">
          <div>
            <span class="dex">#${String(p.dex).padStart(4, '0')}</span>
            ${p.regionalForm ? `<span class="form-badge">${p.regionalForm}</span>` : ''}
            <div class="name" style="margin:2px 0 0;">${p.name}</div>
          </div>
        </div>
      </div>
      <div class="types">
        ${p.types.map(t => `<span class="type-badge t-${t}">${t}</span>`).join('')}
      </div>
      ${p.no_spawn ? '<div class="missing-note">Not currently findable</div>' : ''}
    `;
    card.addEventListener('click', () => openDetail(p));
    card.addEventListener('keypress', e => { if (e.key === 'Enter') openDetail(p); });
    grid.appendChild(card);
  }
}

const RARITY_ORDER = ['common', 'uncommon', 'rare', 'ultra-rare'];

// Poke Snacks are cooked with a seasoning item, and whatever that
// seasoning's own spawn_bait_effects are get attached to the finished
// snack (data/cobblemon/spawn_bait_effects/**, see poke_snacks.json).
// Type-seasoned snacks boost that type's spawn chance; the rarity
// seasonings (Golden Apple family, Enchanted Golden Apple) boost the
// chance of a rarer-tier spawn generally. Neither one targets an
// individual species by name -- this just shows which seasonings are
// relevant to a Pokemon given its own type(s) and rarity tier.
function snackTipsHtml(p) {
  if (!SNACKS || p.no_spawn) return '';

  const typeRows = p.types
    .map(t => SNACKS.type_seasoning[t])
    .filter(Boolean)
    .map(s => `<div class="snack-row">Season with <span class="snack-name">${s.name}</span></div>`)
    .join('');

  let rarityRow = '';
  const buckets = new Set((p.spawns || []).map(s => s.bucket));
  const highest = RARITY_ORDER.filter(b => buckets.has(b)).pop();
  if (highest) {
    const r = SNACKS.rarity_seasoning[highest];
    if (r) {
      rarityRow = `<div class="snack-row">Rarity tier is <b>${highest}</b> — a <span class="snack-name">${r.name}</span> seasoning gives a ${r.strength} boost toward rarer spawns in general</div>`;
    }
  }

  if (!typeRows && !rarityRow) return '';

  return `
    <div class="snack-section">
      <h4>Poke Snack tips</h4>
      ${typeRows}
      ${rarityRow}
    </div>
  `;
}

// Special obtain/form-change mechanics (Terastal forms, Primal Reversion,
// fusions, held items, etc.) pulled from the Mega Showdown wiki and this
// server's actual ATM x MSD recipe files -- see tools/mechanics.json.
function mechanicsHtml(p) {
  if (!p.mechanics || !p.mechanics.length) return '';
  return `
    <div class="mechanics-section">
      <h4>Special mechanics</h4>
      ${p.mechanics.map(m => `<div class="mechanics-note">${m}</div>`).join('')}
    </div>
  `;
}

// One evolution-chain row: a small sprite, the Pokemon's name (clickable,
// jumps the sheet to that entry), and the plain-English requirement text.
function evoRow(dexId, description, direction) {
  const target = DEX_BY_ID[dexId];
  if (!target) return '';
  const arrow = direction === 'from' ? '←' : '→';
  return `
    <div class="evo-row">
      ${direction === 'to' ? `<span class="evo-arrow">${arrow}</span>` : ''}
      <img class="evo-sprite" src="${spriteUrl(target)}" onerror="this.onerror=null;this.src='${SPRITE_FALLBACK}'" alt="${target.name} sprite">
      <div class="evo-info">
        <span class="evo-name" data-goto="${target.id}">${target.name}${target.regionalForm ? ` (${target.regionalForm})` : ''}</span>
        <span class="evo-desc">${description}</span>
      </div>
      ${direction === 'from' ? `<span class="evo-arrow">${arrow}</span>` : ''}
    </div>
  `;
}

function evolutionHtml(p) {
  const before = EVOLVES_FROM[p.id] || [];
  const after = p.evolvesTo || [];
  if (!before.length && !after.length) return '';
  const beforeHtml = before.map(e => evoRow(e.from, e.description, 'from')).join('');
  const afterHtml = after.map(e => evoRow(e.to, e.description, 'to')).join('');
  return `
    <div class="evo-section">
      <h4>Evolution</h4>
      ${beforeHtml}
      ${afterHtml}
    </div>
  `;
}

// Cancels any in-progress speech and speaks the given text aloud, toggling
// a wiggling ".speaking" state on the button that triggered it (anime
// Pokedex "read the entry aloud" flavor). Silently disables the button
// instead of throwing if the browser has no speechSynthesis support.
function speak(text, btn) {
  if (!window.speechSynthesis) {
    if (btn) { btn.disabled = true; btn.title = 'Read-aloud not supported in this browser'; }
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  utter.pitch = 1.05;
  if (btn) {
    btn.classList.add('speaking');
    utter.onend = () => btn.classList.remove('speaking');
    utter.onerror = () => btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(utter);
}

// The Rotom-Dex-style "flavor text" speech bubble, with a speaker button
// that reads the entry aloud like the anime's Pokedex.
function flavorHtml(p) {
  if (!p.flavorText) return '';
  return `
    <div class="flavor-bubble">
      <span class="flavor-text">${p.flavorText}</span>
      <button type="button" class="speak-btn" aria-label="Read the Pokedex entry aloud" title="Read aloud">🔊</button>
    </div>
  `;
}

function openDetail(p) {
  const sheet = document.getElementById('sheet');
  sheet.style.setProperty('--screen-color', typeColor(p));
  let spawnHtml;
  if (p.no_spawn) {
    spawnHtml = '<p class="no-spawn-text">Not currently obtainable through a wild spawn on this server. Ask staff if you are looking for this one.</p>';
  } else if (!p.spawns.length) {
    spawnHtml = '<p class="no-spawn-text">No wild spawn data found. This Pokemon may only be obtainable by evolution, breeding, or a special event.</p>';
  } else {
    // Resolve each spawn row's raw biome refs down to real biome names.
    // Drop a row entirely if every ref on it only ever pointed at a mod
    // that isn't installed (Aether/Bumblezone/BiomesOPlenty/etc. compat
    // entries) — keep rows that had no biome restriction ("any biome").
    const rows = p.spawns
      .map(s => {
        const names = new Set();
        for (const b of (s.biomes || [])) for (const n of namesForRef(b)) names.add(n);
        return {
          bucket: s.bucket,
          level: s.level,
          biomes: [...names].sort(),
          hadBiomes: (s.biomes || []).length > 0,
          conditions: s.conditions,
        };
      })
      .filter(s => !s.hadBiomes || s.biomes.length > 0);

    if (!rows.length) {
      spawnHtml = '<p class="no-spawn-text">This Pokemon only had compat spawns for biome mods that aren\'t installed on this server. It may only be obtainable by evolution, breeding, or a special event.</p>';
    } else {
      spawnHtml = rows.map(s => `
        <div class="spawn-row">
          <span class="bucket">${s.bucket}</span>
          <div class="biomes">${
            s.biomes.length
              ? s.biomes.map(b => `<span class="biome-badge">${b}</span>`).join('')
              : '<span class="biome-badge">Any biome</span>'
          }</div>
          ${s.level ? `<div class="level">Level ${s.level[0]}-${s.level[1]}</div>` : ''}
          ${conditionHtml(s)}
        </div>
      `).join('');
    }
  }

  sheet.innerHTML = `
    <div class="sheet-screen">
      <button class="sheet-close" aria-label="Close">&times;</button>
      <img class="sprite-lg" src="${spriteUrl(p)}" onerror="this.onerror=null;this.src='${SPRITE_FALLBACK}'" alt="${p.name} sprite">
      <span class="dex">#${String(p.dex).padStart(4, '0')}</span>
      ${p.regionalForm ? `<span class="form-badge">${p.regionalForm}</span>` : ''}
      <h2>${p.name}</h2>
      <div class="types">
        ${p.types.map(t => `<span class="type-badge t-${t}">${t}</span>`).join('')}
      </div>
    </div>
    <div class="sheet-body">
      ${flavorHtml(p)}
      ${mechanicsHtml(p)}
      ${evolutionHtml(p)}
      <div style="margin-top:14px;">${spawnHtml}</div>
      ${snackTipsHtml(p)}
    </div>
  `;
  sheet.querySelector('.sheet-close').addEventListener('click', closeDetail);
  sheet.querySelectorAll('.evo-name[data-goto]').forEach(el => {
    el.addEventListener('click', () => {
      const target = DEX_BY_ID[el.getAttribute('data-goto')];
      if (target) openDetail(target);
    });
  });
  const speakBtn = sheet.querySelector('.speak-btn');
  if (speakBtn) {
    speakBtn.addEventListener('click', () => speak(p.flavorText, speakBtn));
  }
  document.getElementById('overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeDetail();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

document.getElementById('search').addEventListener('input', render);
document.getElementById('type-filter').addEventListener('change', render);
document.getElementById('biome-filter').addEventListener('change', render);
document.getElementById('sort').addEventListener('change', render);

load();
</script>
</body>
</html>
